[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seir-analysis"
version = "0.1.0"
description = "SEIR Software Analysis module: Java dependency graph and change-impact analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seir-analysis = "seir_analysis.cli:main"

[tool.setuptools]
packages = ["seir_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
